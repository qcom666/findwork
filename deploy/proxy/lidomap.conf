# lidomap.ru: прокси в Москве перед Vercel.
# Российские провайдеры обрывают прямые соединения с серверами Vercel примерно на 16 КБ: HTML ещё доходит, а скрипты нет,
# и сайт не работает. Поэтому lidomap.ru смотрит на этот сервер, а он пересылает запросы на Vercel.
# Vercel получает Host lidomap.ru (домен привязан к проекту), так что куки, проверка Origin и ссылки работают как без прокси.
# Секрет для X-Lidomap-Proxy лежит в /etc/nginx/lidomap-secret.conf (пишет scripts/proxy-secret.sh), в репозитории его нет.

proxy_cache_path /var/cache/nginx/lidomap levels=1:2 keys_zone=lidomap_static:10m max_size=1g inactive=30d use_temp_path=off;

# Роботы. Для Vercel все запросы идут с адреса этого сервера, и частый обход (ClaudeBot делал ~35 запросов в минуту по каталогу)
# включает у Vercel проверку на бота для всего сайта: у людей ломаются вход и кнопки. Поэтому роботов притормаживаем здесь:
# каждому не чаще 10 запросов в минуту и всем вместе не чаще 40, лишнее получает 429 (роботы на это сбавляют темп). Людей не трогаем.
map $http_user_agent $lidomap_bot_ip {
    default "";
    "~*(bot|crawl|spider|slurp|scrap|sniff|facebookexternalhit|python-|curl|wget|httpclient|go-http|java/|okhttp|headless)" $binary_remote_addr;
}
map $http_user_agent $lidomap_bot_all {
    default "";
    "~*(bot|crawl|spider|slurp|scrap|sniff|facebookexternalhit|python-|curl|wget|httpclient|go-http|java/|okhttp|headless)" "bots";
}
limit_req_zone $lidomap_bot_ip zone=lidomap_bot_ip:10m rate=10r/m;
limit_req_zone $lidomap_bot_all zone=lidomap_bot_all:1m rate=40r/m;
# Любой адрес: человеку со всеми предзагрузками страниц хватает с запасом, сканер с сотнями запросов упирается в 429.
limit_req_zone $binary_remote_addr zone=lidomap_ip:10m rate=120r/m;

# Адреса Vercel заданы явно: по имени findwork-rouge.vercel.app попадался 64.29.17.67, до которого из Москвы соединение
# не устанавливается, и такие запросы висели до таймаута. Любой адрес Vercel отдаёт наш проект по Host и SNI lidomap.ru.
upstream lidomap_vercel {
    server 216.198.79.1:443 max_fails=1 fail_timeout=30s;
    server 216.198.79.65:443 max_fails=1 fail_timeout=30s;
    server 76.76.21.21:443 backup;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name lidomap.ru www.lidomap.ru;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://lidomap.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lidomap.ru;

    ssl_certificate /etc/letsencrypt/live/lidomap.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidomap.ru/privkey.pem;

    return 301 https://lidomap.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name lidomap.ru;

    ssl_certificate /etc/letsencrypt/live/lidomap.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidomap.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lidomap_ssl:10m;

    client_max_body_size 10m;

    limit_req zone=lidomap_bot_ip burst=5 nodelay;
    limit_req zone=lidomap_bot_all burst=10 nodelay;
    limit_req_status 429;

    # Те же сканеры подставляют атаки в параметры главной (?pp=phpinfo, ../, union select): тоже отвечаем здесь.
    if ($args ~* "(phpinfo|\.\./|%2e%2e|union.+select|<script|%3cscript|base64_|/etc/passwd|\bcmd=|\bexec\()") {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host lidomap.ru;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Lidomap-Client-IP $remote_addr;
    include /etc/nginx/lidomap-secret.conf;

    proxy_ssl_server_name on;
    proxy_ssl_name lidomap.ru;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    # Новые соединения с возобновлением TLS-сессии к Vercel отсюда зависают: каждый второй запрос висел до таймаута.
    proxy_ssl_session_reuse off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Сборки Next.js не меняются (имя файла от содержимого): держим их здесь, чтобы не ходить за ними на Vercel.
    location /_next/static/ {
        proxy_pass https://lidomap_vercel;
        proxy_cache lidomap_static;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # robots.txt держим копией: если Vercel всё же покажет проверку на бота, роботы получат правила, а не 403.
    location = /robots.txt {
        proxy_pass https://lidomap_vercel;
        proxy_cache lidomap_static;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout http_403 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Set-Cookie;
    }

    # Сканеры уязвимостей перебирают /.env, /.git, wp-login.php и подобное. Отвечаем им здесь: для Vercel такие запросы
    # с адреса прокси выглядят как атака, и он включает проверку на бота для всего сайта (22.10 в 12:44 UTC так и было).
    # /.well-known/ пропускаем: через /.well-known/vercel/… страница проверки Vercel проверяет браузер (без него «код 99»).
    location ~* (/\.(?!well-known/)|\.(php\d?|aspx?|jsp|cgi|env|ini|sql|bak|old|swp|yml|yaml|log)$|/wp-|xmlrpc|phpmyadmin|/cgi-bin) {
        return 404;
    }

    location / {
        # limit_req здесь заменяет серверные, поэтому лимиты роботов повторяем.
        limit_req zone=lidomap_bot_ip burst=5 nodelay;
        limit_req zone=lidomap_bot_all burst=10 nodelay;
        limit_req zone=lidomap_ip burst=60 nodelay;
        proxy_pass https://lidomap_vercel;
    }
}
