# lidomap.ru: сайт работает на этом сервере (Next.js на 127.0.0.1:3000, служба lidomap, базы в /var/lib/lidomap), nginx перед ним.
# Раньше здесь был прокси на Vercel, но Vercel видел всех посетителей с одного адреса и включал проверку на бота (lidomap-vercel.conf).

proxy_cache_path /var/cache/nginx/lidomap levels=1:2 keys_zone=lidomap_static:10m max_size=1g inactive=30d use_temp_path=off;

# Роботы: каждому не чаще 10 запросов в минуту и всем вместе не чаще 40, лишнее получает 429 (роботы на это сбавляют темп).
# Сервер маленький, а обход каталога со всеми фильтрами бесконечен. Людей не трогаем.
# Уведомления Telegram и ЮKassa (их пересылает копия на Vercel) под лимиты роботов не попадают, хоть у Telegram и «Bot» в подписи.
map $uri $lidomap_hook {
    default 0;
    ~^/api/(telegram/webhook|billing/yookassa)$ 1;
}
map "$lidomap_hook:$http_user_agent" $lidomap_bot_ip {
    default "";
    "~^1:" "";
    "~*^0:.*(bot|crawl|spider|slurp|scrap|sniff|facebookexternalhit|python-|curl|wget|httpclient|go-http|java/|okhttp|headless)" $binary_remote_addr;
}
map "$lidomap_hook:$http_user_agent" $lidomap_bot_all {
    default "";
    "~^1:" "";
    "~*^0:.*(bot|crawl|spider|slurp|scrap|sniff|facebookexternalhit|python-|curl|wget|httpclient|go-http|java/|okhttp|headless)" "bots";
}
limit_req_zone $lidomap_bot_ip zone=lidomap_bot_ip:10m rate=10r/m;
limit_req_zone $lidomap_bot_all zone=lidomap_bot_all:1m rate=40r/m;
# Любой адрес: человеку со всеми предзагрузками страниц хватает с запасом, сканер с сотнями запросов упирается в 429.
limit_req_zone $binary_remote_addr zone=lidomap_ip:10m rate=120r/m;

upstream lidomap_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name lidomap.ru www.lidomap.ru;

    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://lidomap.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lidomap.ru;

    ssl_certificate /etc/letsencrypt/live/lidomap.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidomap.ru/privkey.pem;

    return 301 https://lidomap.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name lidomap.ru;

    ssl_certificate /etc/letsencrypt/live/lidomap.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lidomap.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:lidomap_ssl:10m;

    client_max_body_size 10m;

    limit_req zone=lidomap_bot_ip burst=5 nodelay;
    limit_req zone=lidomap_bot_all burst=10 nodelay;
    limit_req_status 429;

    # Те же сканеры подставляют атаки в параметры главной (?pp=phpinfo, ../, union select): тоже отвечаем здесь.
    if ($args ~* "(phpinfo|\.\./|%2e%2e|union.+select|<script|%3cscript|base64_|/etc/passwd|\bcmd=|\bexec\()") {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Адрес посетителя: перезаписываем, а не дописываем, чтобы его нельзя было подделать своим X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Сборки Next.js не меняются (имя файла от содержимого): держим копию, чтобы после выкладки старые файлы ещё отдавались.
    location /_next/static/ {
        proxy_pass http://lidomap_app;
        proxy_cache lidomap_static;
        proxy_cache_valid 200 30d;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # robots.txt держим копией: роботы получат правила, даже если сайт перезапускается.
    location = /robots.txt {
        proxy_pass http://lidomap_app;
        proxy_cache lidomap_static;
        proxy_cache_valid 200 10m;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Set-Cookie;
    }

    # Сканеры уязвимостей перебирают /.env, /.git, wp-login.php и подобное: отвечаем им здесь, сайт их даже не видит.
    # /.well-known/ пропускаем (там файлы подтверждения и служебные адреса).
    location ~* (/\.(?!well-known/)|\.(php\d?|aspx?|jsp|cgi|env|ini|sql|bak|old|swp|yml|yaml|log)$|/wp-|xmlrpc|phpmyadmin|/cgi-bin) {
        return 404;
    }

    location / {
        # limit_req здесь заменяет серверные, поэтому лимиты роботов повторяем.
        limit_req zone=lidomap_bot_ip burst=5 nodelay;
        limit_req zone=lidomap_bot_all burst=10 nodelay;
        limit_req zone=lidomap_ip burst=60 nodelay;
        proxy_pass http://lidomap_app;
    }
}
