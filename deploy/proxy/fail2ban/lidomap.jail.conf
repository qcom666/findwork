# Бан на час адресам, которые за минуту набрали 30 ответов 400/404/429 у прокси lidomap.ru:
# иначе их запросы доходят до Vercel с адреса прокси, и Vercel включает проверку на бота для всего сайта.
[lidomap-scan]
enabled  = true
port     = http,https
filter   = lidomap-scan
logpath  = /var/log/nginx/access.log
backend  = auto
maxretry = 30
findtime = 60
bantime  = 3600
ignoreip = 127.0.0.1/8 ::1
