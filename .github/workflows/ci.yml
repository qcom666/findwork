name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы
        run: npx tsc --noEmit
      - name: Тесты
        run: npm test
      - name: Качество каталога
        run: python3 -m unittest discover -s ingest -p 'test_*.py'
      - name: Сборка
        run: npm run build
